name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Generate verified reports
        run: |
          python -m golshi_pet validate pet --strict --json
          python -m golshi_pet derby pet \
            --plan examples/gold-ship-chaos-race.json \
            --strict \
            --json-out build/pet-derby/report.json \
            --html-out build/pet-derby/report.html \
            --json
          python -m golshi_pet backdrop-audit pet \
            --backgrounds examples/backgrounds.json \
            --policy examples/backdrop-policy.json \
            --output-dir build/backdrop-audit \
            --json
          python scripts/build_site.py
          python scripts/check_web.py site --require-assets
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
