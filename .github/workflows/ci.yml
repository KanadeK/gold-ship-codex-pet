name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit and integration tests
        run: python -m pytest -q
      - name: Static checks
        if: matrix.python == '3.13'
        run: |
          python -m ruff check src tests scripts
          python -m mypy src/golshi_pet scripts
          python scripts/secret_scan.py
          python scripts/check_web.py web
      - name: Coverage
        if: matrix.python == '3.13'
        run: |
          python -m coverage run --branch -m pytest -q
          python -m coverage report --fail-under=90
          python -m coverage xml
      - name: Pet contract
        if: matrix.python == '3.13'
        run: |
          python -m golshi_pet validate pet --strict --json
          python -m golshi_pet derby pet \
            --plan examples/gold-ship-chaos-race.json \
            --strict \
            --json-out build/pet-derby/report.json \
            --html-out build/pet-derby/report.html \
            --json
          python -m golshi_pet backdrop-audit pet \
            --backgrounds examples/backgrounds.json \
            --policy examples/backdrop-policy.json \
            --output-dir build/backdrop-audit \
            --json
      - name: Build release and site
        if: matrix.python == '3.13'
        run: |
          python scripts/build_release.py
          python scripts/package_smoke.py
          python scripts/build_site.py
          python scripts/check_web.py site --require-assets
      - name: Upload acceptance evidence
        if: matrix.python == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-evidence
          path: |
            build/
            dist/
            site/
            coverage.xml
          if-no-files-found: error
          retention-days: 14

  action-smoke:
    name: Composite Action smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          pet-path: pet
          output-dir: build/action-backdrop
