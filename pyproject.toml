[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gold-ship-codex-pet"
version = "0.1.0"
description = "Gold Ship Codex v2 fan pet with reusable multi-background legibility auditing"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "KanadeK" }]
keywords = [
  "codex",
  "codex-pet",
  "desktop-pet",
  "spritesheet",
  "umamusume",
  "gold-ship",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["Pillow>=11.1,<13"]

[project.optional-dependencies]
dev = [
  "build>=1.2.2,<2",
  "coverage[toml]>=7.6,<8",
  "mypy>=1.14,<2",
  "PyYAML>=6.0,<7",
  "pytest>=8.3,<9",
  "ruff>=0.16.1,<1",
  "setuptools>=75,<90",
  "types-Pillow>=10.2,<12",
  "wheel>=0.45,<1",
]

[project.scripts]
goldship-pet = "golshi_pet.cli:main"
golshi-pet = "golshi_pet.cli:main"

[project.urls]
Homepage = "https://kanadek.github.io/gold-ship-codex-pet/"
Repository = "https://github.com/KanadeK/gold-ship-codex-pet"
Issues = "https://github.com/KanadeK/gold-ship-codex-pet/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
golshi_pet = ["py.typed"]

[tool.coverage.run]
branch = true
source = ["golshi_pet"]
omit = ["src/golshi_pet/__main__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["golshi_pet"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
